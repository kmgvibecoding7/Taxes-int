// inp (USD): rev, exp, n, sal, divShare, act
function evalCountry(c,inp){
 const fx=FXR[c.cur],L=u=>u*fx,U=l=>l/fx;
 const sL=L(inp.sal),revL=L(inp.rev),expL=L(inp.exp),n=inp.n,payroll=n*inp.sal;
 const out=[];
 const run=r=>{
  const contrib=n*U((r&&r.er?r.er:c.er)(sL));
  const wh=n*U((r&&r.wh?r.wh:c.wh)(sL));
  const profit=inp.rev-inp.exp-payroll-contrib,profL=L(profit);
  let ptaxL,pName,pFormula;
  if(!r){ptaxL=c.cit(Math.max(0,profL));pName="Налог на прибыль";pFormula=`${fmtU(Math.max(0,profit))} × ${c.citTxt}`}
  else{
   const base=r.kind==="rev"?revL:Math.max(0,profL);
   ptaxL=base*r.rate/100;pName=r.n;
   pFormula=`${fmtU(U(base))} × ${r.rate}%`;
   if(r.minRev&&ptaxL<revL*r.minRev/100){ptaxL=revL*r.minRev/100;pFormula=`минимальный налог: ${fmtU(inp.rev)} × ${r.minRev}%`}
   if(r.reduce&&n>0){const red=Math.min(L(contrib),ptaxL*.5);ptaxL-=red;pFormula+=` − вычет взносов ${fmtU(U(red))}`}
  }
  let v;
  if(!r||r.vat==="general")v=c.vat(revL,expL);
  else if(r.vat==="exempt")v={a:0,t:"режим освобождает от НДС"};
  else v=r.vat(revL,expL);
  const aftL=Math.max(0,profL-ptaxL),divL=c.div(aftL*inp.divShare);
  const rows=[
   [pName,pFormula,U(ptaxL),"profit"],
   ["НДС (к уплате)",v.t,U(v.a),"vat"],
   ["Взносы работодателя",`${n} чел. × ${fmtU(U(((r&&r.er)||c.er)(sL)))}`,contrib,"fot"],
   ["Удержания с зарплат (налоги и взносы работников)",`${n} чел. × ${fmtU(U(((r&&r.wh)||c.wh)(sL)))}`,wh,"fot"],
   ["Налог на дивиденды",`${fmtU(U(aftL))} × ${Math.round(inp.divShare*100)}%`,U(divL),"profit"]];
  const total=rows.reduce((s,x)=>s+x[2],0);
  const g=k=>rows.filter(x=>x[3]===k).reduce((s,x)=>s+x[2],0);
  const net=profit-U(ptaxL)-U(divL);
  let ok=true,reason="";
  if(r){
   if(r.acts&&!r.acts.includes(inp.act)){ok=false;reason="режим недоступен для выбранного вида деятельности"}
   else if(r.limRevL&&revL>r.limRevL){ok=false;reason=`выручка превышает лимит режима (${fmtU(U(r.limRevL))})`}
   else if(r.limEmp&&n>r.limEmp){ok=false;reason=`численность превышает лимит (${r.limEmp} чел.)`}
   else if(r.limProfL&&profL>r.limProfL){ok=false;reason=`прибыль превышает лимит режима (${fmtU(U(r.limProfL))})`}
  }
  out.push({name:r?r.n:"Общий режим",reg:r,rows,ok,reason,total,net,profit,contrib,grp:{profit:g("profit"),fot:g("fot"),vat:g("vat"),other:0}});
 };
 run(null);c.regimes.forEach(run);
 out.sort((a,b)=>(b.ok-a.ok)||(a.total-b.total));
 return {list:out,best:out.find(x=>x.ok),profit:out[0].profit};
}

function pCompare(q){
 if(q.c)S.cmp=q.c.split(",").filter(x=>byId[x]);
 if(q.cur)cur=q.cur;
 const sel=S.cmp.length>=2?S.cmp:["kazakhstan","russia"];
 const cs=sel.map(i=>byId[i]);
 const bestOf=c=>evalCountry(c,mkInp(600000,.45,10,9000)).best;
 const rowsDef=[
  ["КПН (базовый)",c=>c.n.cit,v=>v+"%"],
  ["Лучший режим МСБ (ставка)",c=>c.regimes.length?Math.min(...c.regimes.map(r=>r.rate)):null,v=>v==null?"—":v+"%"],
  ["НДС",c=>c.n.vat,v=>v?v+"%":"нет"],
  ["Порог НДС",c=>c.n.vatThrL==null?null:c.n.vatThrL/FXR[c.cur],v=>v==null?"—":fm(v)],
  ["Взносы работодателя",c=>c.n.er,v=>"≈"+v+"%"],
  ["Налог на дивиденды",c=>c.n.div,v=>v+"%"],
  ["Нагрузка, малый бизнес (услуги)",c=>bestOf(c).total/600000*100,v=>pct(v)]
 ];
 const body=rowsDef.map(([n,f,fmt])=>{
  const vals=cs.map(f),nums=vals.filter(v=>v!=null);

  return `<tr><th scope="row">${n}</th>${vals.map(v=>`<td class="${v!=null&&dif&&v===mn?"min":v!=null&&dif&&v===mxv?"max":""}">${fmt(v)}</td>`).join("")}</tr>`;
 }).join("")+
 `<tr><th scope="row">Условия</th>${cs.map(c=>`<td class="muted">${mark(c.disp.er)}<br>Дивиденды: ${mark(c.disp.div)}</td>`).join("")}</tr>`;
 const res=cs.map(c=>({c,r:bestOf(c)})).sort((a,b)=>a.r.total-b.r.total);
 const mx=Math.max(...res.map(x=>x.r.total/600000));
 return layout(`<h1>Сравнение стран</h1>
 <div class="chips" id="cmpchips">${C.map(c=>`<label><input type="checkbox" value="${c.id}" ${sel.includes(c.id)?"checked":""}><span>${c.flag} ${cn(c)}</span></label>`).join("")}</div>
 <div style="max-width:200px;margin-bottom:12px"><div class="seg" id="curseg"><button data-v="KZT" class="${cur==="KZT"?"on":""}">KZT</button><button data-v="USD" class="${cur==="USD"?"on":""}">USD</button></div></div>
 <div class="tw"><table><thead><tr><th></th>${cs.map(c=>`<th>${c.flag} ${cn(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
 <p class="muted"><span style="background:rgba(27,127,75,.3);padding:0 6px">мин.</span> <span style="background:rgba(179,38,30,.25);padding:0 6px">макс.</span> в строке.</p>
 <div class="ok warn"><b>Вывод:</b> для малого бизнеса (выручка ${fm(600000)}, 10 сотрудников, услуги) нагрузка ниже всего в стране «${cn(res[0].c)}» — ${pct(res[0].r.total/600000*100)}; выше всего — «${cn(res[res.length-1].c)}» — ${pct(res[res.length-1].r.total/600000*100)}.</div>
 <h2>Нагрузка по типовому кейсу</h2><div class="card">${legend()}${res.map(({c,r})=>`<div class="brow"><span>${c.flag} ${cn(c)}</span><div>${stackBar(r.grp,r.total/600000,mx)}</div><b>${pct(r.total/600000*100)}</b></div>`).join("")}</div>
 <h2>Готовые сравнения</h2><div class="chips">
  ${[["КЗ vs РФ","kazakhstan,russia"],["КЗ vs УЗ","kazakhstan,uzbekistan"],["КЗ vs КГ","kazakhstan,kyrgyzstan"],["Центральная Азия","kazakhstan,uzbekistan,kyrgyzstan"],["ЕАЭС","kazakhstan,russia,kyrgyzstan"]].map(p=>`<a class="btn alt sm" href="#/sravnenie?c=${p[1]}">${p[0]}</a>`).join("")}</div>
 <p><button class="btn sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);this.textContent='Ссылка скопирована'">Скопировать ссылку</button> <button class="btn alt sm" onclick="window.print()">Экспорт в PDF (печать)</button></p>${disc()}`,"compare","Сравнение стран");
}

/* ----- Калькулятор ----- */
function readCalcInp(){
 const k=S.calc,rate=cur==="KZT"?FXR.KZT:1;
 const rev=k.rev/rate,sal=k.sal/rate;
 const exp=k.expMode==="pct"?rev*k.expV/100:k.expV/rate;
 return {rev,exp,n:k.n,sal,divShare:k.div?k.divShare/100:0,act:k.act};
}
function pCalc(q){
 if(q.c){S.calc.countries=q.c.split(",").filter(x=>byId[x]).slice(0,7)}
 const k=S.calc;
 return layout(`<h1>Калькулятор налоговой нагрузки</h1>
 <div class="card"><div class="fld"><label>Страна / страны</label><div class="chips" id="ccs">${C.map(c=>`<label><input type="checkbox" value="${c.id}" ${k.countries.includes(c.id)?"checked":""}><span>${c.flag} ${cn(c)}</span></label>`).join("")}</div></div>
 <form class="f" id="cf" onsubmit="return false">
  <div class="fld"><label>Форма</label><div class="seg" id="fseg"><button type="button" data-v="ip" class="${k.form==="ip"?"on":""}">ИП</button><button type="button" data-v="ul" class="${k.form==="ul"?"on":""}">Юрлицо</button></div><small>Расчёт ведётся для юрлица; для ИП ставки могут отличаться</small></div>
  <div class="fld"><label for="act">Вид деятельности</label><select id="act">${[["trade","Торговля"],["services","Услуги"],["it","IT"],["prod","Производство"],["food","Общепит"]].map(a=>`<option value="${a[0]}" ${k.act===a[0]?"selected":""}>${a[1]}</option>`).join("")}</select><small>Влияет на доступность режимов (Кыргызстан, Узбекистан)</small></div>
  <div class="fld"><label>Валюта</label><div class="seg" id="ccur"><button type="button" data-v="KZT" class="${cur==="KZT"?"on":""}">KZT</button><button type="button" data-v="USD" class="${cur==="USD"?"on":""}">USD</button></div></div>
  <div class="fld"><label for="rev">Годовая выручка</label><input id="rev" type="number" min="0" step="any" value="${k.rev}"><small>Весь доход за год до налогов</small></div>
  <div class="fld"><label for="expV">Расходы без зарплат</label><input id="expV" type="number" min="0" step="any" value="${k.expV}"><div class="seg" id="eseg" style="margin-top:4px"><button type="button" data-v="pct" class="${k.expMode==="pct"?"on":""}">% выручки</button><button type="button" data-v="abs" class="${k.expMode==="abs"?"on":""}">сумма</button></div></div>
  <div class="fld"><label for="n">Число сотрудников</label><input id="n" type="number" min="0" step="1" value="${k.n}"></div>
  <div class="fld"><label for="sal">Средняя зарплата в год</label><input id="sal" type="number" min="0" step="any" value="${k.sal}"><small>На одного сотрудника, до налогов</small></div>
  <div class="fld"><label><input type="checkbox" id="div" ${k.div?"checked":""}> Выплата дивидендов</label><input id="divS" type="number" min="0" max="100" value="${k.divShare}" ${k.div?"":"disabled"}><small>Доля чистой прибыли, %</small></div>
 </form></div><div id="cres"></div>`,"calc","Калькулятор");
}
function renderCalcRes(){
 const k=S.calc,el=document.getElementById("cres"); if(!el)return;
 const warn=[];
 if(!(k.rev>0))warn.push("Укажите выручку больше нуля.");
 if(k.n<0||k.sal<0||k.expV<0)warn.push("Значения не могут быть отрицательными.");
 if(k.expMode==="pct"&&k.expV>100)warn.push("Расходы не могут быть больше 100% выручки.");
 if(k.div&&(k.divShare<0||k.divShare>100))warn.push("Доля дивидендов — от 0 до 100%.");
 if(!k.countries.length)warn.push("Выберите хотя бы одну страну.");
 if(warn.length){el.innerHTML=warn.map(w=>`<div class="warn err">${w}</div>`).join("");return}
 const inp=readCalcInp();
 const res=k.countries.map(id=>({c:byId[id],e:evalCountry(byId[id],inp)}));
 const mx=Math.max(...res.map(r=>r.e.best.total/inp.rev));
 let h="";
 res.forEach(({c,e})=>{
  const b=e.best;
  h+=`<h2>${c.flag} ${cn(c)}</h2><div class="card">
   <div class="grid"><div><div class="muted">Налоги за год (${esc(b.name)})</div><div class="big">${fm(b.total)}</div></div>
   <div><div class="muted">Нагрузка от выручки</div><div class="big">${pct(b.total/inp.rev*100)}</div><div class="muted">от прибыли: ${e.profit>0?pct(b.total/e.profit*100):"—"}</div></div>
   <div><div class="muted">Чистый доход владельца</div><div class="big">${fm(b.net)}</div><div class="muted">до дивидендов и после налога на них</div></div></div>
   ${e.profit<0?`<div class="warn">Прибыль отрицательная: налог на прибыль не начисляется, но взносы и НДС могут остаться.</div>`:""}
   ${b.reg&&b.reg.warn?`<div class="warn">${mark(b.reg.warn)}</div>`:""}
   <h3 style="margin-top:14px">Расшифровка: база × ставка = сумма</h3>
   <div class="tw"><table><tbody>${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="muted">${mark(r[1])}</td><td style="text-align:right"><b>${fm(r[2])}</b></td></tr>`).join("")}
   <tr><th>Итого</th><th></th><th style="text-align:right">${fm(b.total)}</th></tr></tbody></table></div>
   <h3 style="margin-top:14px">Режимы внутри страны</h3>
   <div class="tw"><table><thead><tr><th>Режим</th><th>Налоги</th><th>Нагрузка</th></tr></thead><tbody>
   ${e.list.map(x=>`<tr style="${x.ok?"":"opacity:.6"}"><td>${mark(x.name)}${x===b?` <span class="pill">лучший</span>`:""}${x.ok?"":`<div class="warn err" style="margin:4px 0 0">Недоступен: ${x.reason}</div>`}</td><td>${fm(x.total)}</td><td>${pct(x.total/inp.rev*100)}</td></tr>`).join("")}</tbody></table></div>
   <p class="muted" style="margin-top:10px">Не учтено: ${c.id==="usa"?"налоги штатов и sales tax, pass-through-налогообложение, ":""}налоги на имущество, землю и транспорт, потолки взносов${c.id==="kazakhstan"?" (ОПВР, СО, ООСМС)":""}. См. <a href="#/strana/${c.id}">страницу страны</a>.</p></div>`;
 });
 if(res.length>1){
  const s=[...res].sort((a,b)=>a.e.best.total-b.e.best.total);
  h+=`<h2>Сравнение между странами</h2><div class="card">${legend()}${s.map(({c,e})=>`<div class="brow"><span>${c.flag} ${cn(c)}</span><div>${stackBar(e.best.grp,e.best.total/inp.rev,mx)}</div><b>${pct(e.best.total/inp.rev*100)}</b></div>`).join("")}</div>`;
 }
 h+=`<p class="muted">Ставки актуальны на ${UPD}. ${t("disc")} ${FXNOTE}</p>
  <div class="btns"><button class="btn alt sm" onclick="window.print()">Экспорт в PDF (печать)</button></div>`;
 el.innerHTML=h;
}
function bindCalc(){
 const k=S.calc,num=(id,key)=>{const e=document.getElementById(id);e.oninput=()=>{k[key]=parseFloat(e.value)||0;renderCalcRes()}};
 num("rev","rev");num("expV","expV");num("n","n");num("sal","sal");num("divS","divShare");
 document.getElementById("act").onchange=e=>{k.act=e.target.value;renderCalcRes()};
 document.getElementById("div").onchange=e=>{k.div=e.target.checked;document.getElementById("divS").disabled=!k.div;renderCalcRes()};
 document.querySelectorAll("#ccs input").forEach(i=>i.onchange=()=>{k.countries=[...document.querySelectorAll("#ccs input:checked")].map(x=>x.value);renderCalcRes()});
 document.querySelectorAll("#fseg button").forEach(b=>b.onclick=()=>{k.form=b.dataset.v;document.querySelectorAll("#fseg button").forEach(x=>x.classList.toggle("on",x===b))});
 document.querySelectorAll("#eseg button").forEach(b=>b.onclick=()=>{k.expMode=b.dataset.v;k.expV=k.expMode==="pct"?45:Math.round(k.rev*.45);document.getElementById("expV").value=k.expV;document.querySelectorAll("#eseg button").forEach(x=>x.classList.toggle("on",x===b));renderCalcRes()});
 document.querySelectorAll("#ccur button").forEach(b=>b.onclick=()=>{
  const old=cur;cur=b.dataset.v;if(old===cur)return;try{localStorage.setItem("cur",cur)}catch(e){}
  const f=cur==="KZT"?FXR.KZT:1/FXR.KZT; k.rev=Math.round(k.rev*f);k.sal=Math.round(k.sal*f);if(k.expMode==="abs")k.expV=Math.round(k.expV*f);route()});
 renderCalcRes();
}

/* ----- Подбор режима ----- */
const QZ=[
 {q:"В какой стране вы ведёте бизнес?",key:"country",o:[...C.map(c=>[c.id,c.flag+" "+c.ru]),["any","Ещё выбираю"]]},
 {q:"Вы резидент этой страны?",key:"res",o:[["yes","Да"],["no","Нет"]]},
 {q:"Вид деятельности",key:"act",o:[["trade","Торговля"],["services","Услуги"],["it","IT"],["prod","Производство"],["food","Общепит"]]},
 {q:"Ожидаемая выручка в год",key:"rev",o:[[30000,"до $50 тыс."],[120000,"$50–250 тыс."],[500000,"$250 тыс. – 1 млн"],[2500000,"$1–5 млн"],[8000000,"более $5 млн"]]},
 {q:"Сколько у вас сотрудников?",key:"n",o:[[0,"Только я"],[3,"1–5"],[15,"6–30"],[60,"31–100"],[150,"более 100"]]},
 {q:"Кто ваши клиенты?",key:"cl",o:[["fl","Физлица"],["co","Компании"],["gov","Госсектор"],["exp","Экспорт"]]},
 {q:"Какая примерно доля расходов в выручке?",key:"exp",o:[[.2,"До 30%"],[.5,"30–60%"],[.75,"Более 60%"]]},
 {q:"Нужны дивиденды или внешние инвесторы?",key:"div",o:[["yes","Да"],["no","Нет"]]}
];
function pQuiz(){
 const z=S.quiz;
 if(z.step>=QZ.length)return quizResult();
 const q=QZ[z.step];
 return layout(`<h1>Подбор налогового режима</h1><div class="muted">Вопрос ${z.step+1} из ${QZ.length}</div>
  <div class="progress"><i style="width:${z.step/QZ.length*100}%"></i></div>
  <div class="card"><h2 style="margin-top:0">${q.q}</h2><div class="opts">${q.o.map((o,i)=>`<button data-i="${i}">${o[1]}</button>`).join("")}</div>
  <p>${z.step>0?`<button class="btn alt sm" id="qback">← Назад</button>`:""}</p></div>`,"more","Подбор режима");
}
function bindQuiz(){
 const z=S.quiz;
 document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{z.a[QZ[z.step].key]=QZ[z.step].o[+b.dataset.i][0];z.step++;route()});
 const bk=document.getElementById("qback");if(bk)bk.onclick=()=>{z.step--;route()};
 const rs=document.getElementById("qreset");if(rs)rs.onclick=()=>{z.step=0;z.a={};route()};
 const go=document.getElementById("qgo");if(go)go.onclick=()=>{
  const a=z.a,rate=cur==="KZT"?FXR.KZT:1;
  S.calc.countries=a.country==="any"?["kazakhstan"]:[a.country];S.calc.act=a.act;
  S.calc.rev=Math.round(a.rev*rate);S.calc.expMode="pct";S.calc.expV=Math.round(a.exp*100);S.calc.n=a.n;S.calc.sal=Math.round(7000*rate);
  S.calc.div=a.div==="yes";S.calc.divShare=50;go("#/kalkulyator?c="+S.calc.countries.join(","))};
}
function quizResult(){
 const a=S.quiz.a,inp=mkInp(a.rev,a.exp,a.n,7000,a.div==="yes"?.5:0,a.act);
 let h=`<h1>Результат подбора</h1><div class="progress"><i style="width:100%"></i></div>`;
 if(a.res==="no")h+=`<div class="warn">Вы не резидент: ставки для нерезидентов и удержания у источника могут отличаться от показанных.</div>`;
 if(a.cl==="exp")h+=`<div class="warn">Для экспорта проверьте нулевую ставку НДС и валютный контроль.</div>`;
 if(a.cl==="gov")h+=`<div class="warn">Госзаказчики часто работают только с плательщиками НДС — режим без НДС может ограничить рынок.</div>`;
 if(a.div==="yes")h+=`<div class="warn">Внешним инвесторам обычно нужна форма юрлица (ООО/ТОО/LLC), а не ИП.</div>`;
 if(a.country!=="any"){
  const c=byId[a.country],e=evalCountry(c,inp),ok=e.list.filter(x=>x.ok),b=ok[0];
  h+=`<div class="card"><div class="muted">${c.flag} ${cn(c)}</div><h2 style="margin-top:4px">Рекомендуем: ${mark(b.name)}</h2>
   <div class="big">${fm(b.total)} в год</div><div class="muted">нагрузка ${pct(b.total/inp.rev*100)} от выручки (выручка в расчёте: ${fm(inp.rev)})</div>
   <h3 style="margin-top:12px">Почему</h3><ul><li>Минимальная суммарная нагрузка среди доступных режимов.</li><li>Заменяет: ${b.reg?mark(b.reg.rep):"—"}.</li><li>Выручка, численность и вид деятельности вписываются в условия режима.</li></ul>
   ${b.reg&&b.reg.warn?`<div class="warn">${mark(b.reg.warn)}</div>`:""}
   ${ok.slice(1,3).length?`<h3>Альтернативы</h3>${ok.slice(1,3).map(x=>`<div class="kv"><span>${mark(x.name)}</span><b>${fm(x.total)}</b></div>`).join("")}`:""}
   ${e.list.filter(x=>!x.ok).map(x=>`<div class="warn err">${mark(x.name)} недоступен: ${x.reason}</div>`).join("")}
   ${b.reg&&b.reg.limRevL&&L2U(c,b.reg.limRevL)<inp.rev/.8?`<div class="warn">Выручка близка к лимиту режима: при превышении вы потеряете режим.</div>`:""}
   ${c.n.vat>0&&c.n.vatThrL!=null&&inp.rev>=c.n.vatThrL/FXR[c.cur]?`<div class="warn">При такой выручке потребуется регистрация по НДС (порог ${fmtU(c.n.vatThrL/FXR[c.cur])}).</div>`:""}
   <h3>Следующие шаги</h3><p>Регистрация и госпортал: <a href="${c.src[0][1]}" target="_blank" rel="noopener">${esc(c.src[0][0])}</a></p></div>`;
 }else{
  const r=C.map(c=>({c,b:evalCountry(c,inp).best})).sort((x,y)=>x.b.total-y.b.total);
  h+=`<div class="card"><h2 style="margin-top:0">Рейтинг стран под ваш профиль</h2>${r.map((x,i)=>`<div class="kv"><span>${i+1}. ${x.c.flag} ${cn(x.c)} · <span class="muted">${mark(x.b.name)}</span></span><b>${pct(x.b.total/inp.rev*100)}</b></div>`).join("")}</div>`;
 }
 h+=`<div class="btns"><button class="btn" id="qgo">Передать в калькулятор</button><button class="btn alt" id="qreset">Пройти заново</button></div>${disc()}`;
 return layout(h,"more","Подбор режима");
}
const L2U=(c,l)=>l/FXR[c.cur];

function pMeth(){return layout(`<h1>Методология</h1><div class="card">
 <ul><li>Налоговая нагрузка = налог на прибыль или режима + НДС к уплате + взносы работодателя + налоги и взносы, удерживаемые с зарплат, + налог на дивиденды.</li>
 <li>Прибыль = выручка − расходы без зарплат − ФОТ − взносы работодателя.</li>
 <li>НДС общего режима: ставка × (выручка − расходы без зарплат), если выручка выше порога регистрации. Это приближение: предполагается, что все расходы содержат входящий НДС.</li>

 <li>Дивиденды: доля чистой прибыли × ставка для физлица-резидента.</li>
 <li>Типовые кейсы: микро ($60 тыс., 2 чел.), малый ($600 тыс., 10 чел.), средний ($5 млн, 80 чел.) — предварительные, оклады $6, 9 и 12 тыс. в год.</li>

/* ============ Роутер ============ */
let H=location.hash.replace(/^#/,"")||"/";
function go(h){H=String(h).replace(/^#/,"")||"/";try{history.replaceState(null,"","#"+H)}catch(e){}route()}
document.addEventListener("click",e=>{
 const a=e.target.closest&&e.target.closest("a[href^='#/']");
 if(a){e.preventDefault();go(a.getAttribute("href"))}
});
function route(){
 const raw=H;
 const [path,qs]=raw.split("?"),q=Object.fromEntries(new URLSearchParams(qs||""));
 const seg=path.split("/").filter(Boolean);
 let html,active="home",after=null;
 switch(seg[0]){
  case undefined:html=pHome();break;
  case"strany":html=pCountries();active="countries";break;
  case"strana":html=pCountry(seg[1]);active="countries";break;
  case"sravnenie":html=pCompare(q);active="compare";after=bindCompare;break;
  case"kalkulyator":html=pCalc(q);active="calc";after=bindCalc;break;
  case"podbor":html=pQuiz();active="more";after=bindQuiz;break;
  case"spravochnik":html=pRef();active="more";break;
  case"nalogi":html=pTaxes();active="more";break;
  case"glossarij":html=pGloss();active="more";break;
  case"izmeneniya":html=pChanges();active="more";break;
  case"kalendar":html=pCal();active="more";break;
  case"faq":html=pFaq();active="more";break;
  case"metodologiya":html=pMeth();active="more";break;
  case"kontakty":html=pAbout();active="more";break;
  case"pravovoe":html=pLegal();active="more";break;
  case"istochniki":html=pSources();active="more";break;
  case"eshche":html=pMore();active="more";break;
  case"poisk":html=pSearch(seg[1]);break;
  default:html=pHome();
 }
 document.getElementById("app").innerHTML=html;
 document.getElementById("nav").innerHTML=NAVS.map(n=>`<a href="${n[0]}" class="${n[1]===active?"on":""}" ${n[1]===active?'aria-current="page"':""}><i aria-hidden="true">${n[2]}</i>${t(n[1])}</a>`).join("");
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
 document.documentElement.lang=lang==="kk"?"kk":"ru";
 document.title=(seg[0]==="strana"&&byId[seg[1]]?cn(byId[seg[1]])+" — налоги МСБ":"Налоги МСБ в 7 странах");
 if(after)after();
 window.scrollTo(0,0);
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){};route()});
document.getElementById("sf").onsubmit=e=>{e.preventDefault();const v=document.getElementById("q").value.trim();if(v)go("#/poisk/"+encodeURIComponent(v))};
window.addEventListener("hashchange",()=>{const h=location.hash.replace(/^#/,"")||"/";if(h!==H){H=h;route()}});
route();
</script>
